<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muzik Majlis</title>
<style>
body{
  margin:0;
  background:transparent;
  font-family:Arial,sans-serif;
}
.player{
  max-width:380px;
  margin:20px auto;
  padding:18px;
  box-sizing:border-box;
  border:1px solid #c6dfef;
  border-radius:20px;
  background:#f8fcff;
  box-shadow:0 7px 22px rgba(40,90,130,.12);
  color:#174d78;
}
.title{
  font-size:15px;
  font-weight:bold;
  letter-spacing:.5px;
  margin-bottom:14px;
}
.controls{
  display:flex;
  align-items:center;
  gap:12px;
}
button{
  border:0;
  border-radius:50%;
  width:48px;
  height:48px;
  background:#5aa2d6;
  color:white;
  font-size:19px;
  cursor:pointer;
}
.progress{
  flex:1;
  height:7px;
  background:#dceef9;
  border-radius:10px;
  overflow:hidden;
}
.bar{
  height:100%;
  width:0%;
  background:#5aa2d6;
}
.status{
  font-size:11px;
  color:#66839a;
  margin-top:10px;
}
</style>
</head>

<body>
<div class="player">
  <div class="title">🎵 Muzik Majlis</div>

  <div class="controls">
    <button id="play" type="button">▶</button>
    <div class="progress">
      <div class="bar" id="bar"></div>
    </div>
  </div>

  <div class="status" id="status">Tekan ▶ untuk memainkan muzik</div>
</div>

<audio id="audio" preload="metadata">
  <source src="https://raw.githubusercontent.com/solihinMJ/Kad-kawin/main/paulyudin-romantic-wedding-piano-160698.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById("audio");
const play = document.getElementById("play");
const bar = document.getElementById("bar");
const status = document.getElementById("status");

play.addEventListener("click", async () => {
  if (audio.paused) {
    try {
      await audio.play();
      play.textContent = "Ⅱ";
      status.textContent = "Muzik sedang dimainkan";
    } catch (e) {
      status.textContent = "Muzik gagal dimainkan. Cuba tekan ▶ sekali lagi.";
      console.error(e);
    }
  } else {
    audio.pause();
    play.textContent = "▶";
    status.textContent = "Muzik dijeda";
  }
});

audio.addEventListener("loadedmetadata", () => {
  status.textContent = "Tekan ▶ untuk memainkan muzik";
});

audio.addEventListener("timeupdate", () => {
  if (audio.duration) {
    bar.style.width = (audio.currentTime / audio.duration * 100) + "%";
  }
});

audio.addEventListener("ended", () => {
  play.textContent = "▶";
  bar.style.width = "0%";
  status.textContent = "Muzik tamat";
});

audio.addEventListener("error", () => {
  status.textContent = "Fail muzik tidak dapat dimuatkan.";
});
</script>
</body>
</html>
